<!doctype html>
<html>
<head><title>Snapshot fixture</title></head>
<body>
  <nav aria-label="Primary"><a href="/home">Home</a> <a href="/docs">Docs</a></nav>
  <main>
    <h1>Account&nbsp;settings&#8203;</h1>
    <p>Signed in as <b>ada</b> since 2024.</p>
    <form id="form" aria-label="Profile">
      <label for="name">Name</label><input id="name" value="Ada" required>
      <label><input type="checkbox" checked> Subscribe</label>
      <select aria-label="Plan"><option>Free</option><option selected>Pro</option></select>
      <button type="button">Save</button>
      <button type="button" disabled>Delete</button>
      <button type="button" aria-expanded="false">More</button>
    </form>
    <section id="list" aria-label="Items">
      <ul>
        <li>First <button type="button">Save</button></li>
        <li>Second <button type="button">Save</button></li>
      </ul>
      <table><tr><th>Key</th><th>Value</th></tr><tr><td>plan</td><td>pro</td></tr></table>
    </section>
    <div hidden><button type="button">Hidden</button></div>
    <p id="out"></p>
  </main>
  <script>
    document.querySelector('form button').onclick = () => {
      document.getElementById('out').textContent = 'Saved ' + document.getElementById('name').value;
    };
  </script>
</body>
</html>
